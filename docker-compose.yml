name: berth-delay-boundary
x-python: &python
  build: ./backend
  image: berth-delay-boundary-python:local
  environment:
    MYSQL_DATABASE: ${MYSQL_DATABASE:-berth}
    MYSQL_USER: ${MYSQL_USER:-berth}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:-berth_local}
    JWT_SECRET: ${JWT_SECRET:-private-demo-berth-local-1074-for-development}
    SEED_DEMO: ${SEED_DEMO:-true}
    OPENBLAS_NUM_THREADS: '1'
    OMP_NUM_THREADS: '1'
  volumes: [artifacts:/var/berth]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-berth-delay-boundary}-frontend
    ports: ['${FRONTEND_PORT:-18273}:80']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1/api/healthz']
      interval: 4s
      timeout: 3s
      retries: 15
  backend:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME:-berth-delay-boundary}-backend
    command: [uvicorn, src.main:app, --host, '0.0.0.0', --port, '8000']
    ports: ['${BACKEND_PORT:-19273}:8000']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 4s
      timeout: 3s
      retries: 20
  worker:
    <<: *python
    container_name: ${COMPOSE_PROJECT_NAME:-berth-delay-boundary}-worker
    command: [python, -m, src.worker]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import time; from pathlib import Path; assert time.time() - Path('/tmp/berth-heartbeat').stat().st_mtime < 15"]
      interval: 4s
      timeout: 3s
      retries: 20
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-berth-delay-boundary}-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-berth}
      MYSQL_USER: ${MYSQL_USER:-berth}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-berth_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-berth_root_local}
    ports: ['${DB_PORT:-17773}:3306']
    volumes: [database:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'mysql -h 127.0.0.1 -u "$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" "$${MYSQL_DATABASE}" -e "SELECT 1"']
      start_period: 20s
      interval: 4s
      timeout: 4s
      retries: 20
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-berth-delay-boundary}-redis
    command: [redis-server, --appendonly, 'yes']
    volumes: [queue:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 4s
      timeout: 3s
      retries: 15
volumes:
  database:
  queue:
  artifacts:
